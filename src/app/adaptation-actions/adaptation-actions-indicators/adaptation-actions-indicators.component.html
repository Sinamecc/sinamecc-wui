<div class="container-custom">
  <div class="header-container flex flex-col justify-center items-center mb-4">
    <h2 translate>adaptationAction.form4.title</h2>
  </div>
  <div class="flex flex-col gap-4">
    <app-indicator-search
      [indicators]="adaptationAction?.indicator_list"
      (indicatorResults)="indicatorsToShow = $event"
    />
    <div class="flex flex-row justify-end items-center">
      <button type="button" class="primary-button" (click)="openDialog()">
        <span translate>adaptationAction.form4.add</span>
      </button>
    </div>
    <div class="flex flex-col gap-2">
      <table mat-table [dataSource]="indicatorsToShow" class="mat-elevation-z1 w-full">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let item">{{ item.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>
            <span translate>adaptationAction.form4.indicatorName</span>
          </th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item">
            <button
              mat-icon-button
              color="warn"
              (click)="openConfirmationDialog(item.id)"
              matTooltip="{{ 'general.delete' | translate }}"
              matTooltipPosition="above"
            >
              <mat-icon>delete</mat-icon>
            </button>
            <button
              mat-icon-button
              (click)="openDialog(item.id)"
              matTooltip="{{ 'general.edit' | translate }}"
              matTooltipPosition="above"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['id', 'name', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id', 'name', 'actions']"></tr>
      </table>
    </div>
    <div class="button-box flex flex-row justify-end items-center">
      <button mat-raised-button color="primary" type="button" (click)="next()">
        <span translate>general.next</span>
      </button>
    </div>
  </div>
</div>
